# Shared configuration for all environments
# This is the single source of truth for common values

[shared]
# AI Gateway Configuration
aig_account_id = "119641edf4fbeb5ac613d6b7db85f691"
aig_gateway_id = "sky-ai"

# OpenAI Configuration
openai_model = "gpt-4o-mini"
openai_embedding_model = "text-embedding-3-small"

# Authentication
access_auth_enabled = true
allow_api_key_bypass = true
better_auth_url = "https://sky-ai-api.ahmad22selim.workers.dev"

# Development Environment
environment = "dev"

# Database Configuration (Development)
dev_database_name = "sky-ai-dev"
dev_database_id = "cd67c1c8-66db-43d2-9b43-4e3ec6398d04"

# Vectorize Configuration (Development)
dev_vectorize_index = "sky-ai-memory-dev"

# R2 Configuration (Development)
dev_r2_bucket = "sky-ai-artifacts-dev"

# Production Environment Overrides
[prod]
environment = "prod"
allow_api_key_bypass = false

# Production Database Configuration
[prod.database]
database_name = "sky-ai-prod"
database_id = "e0dc4ec1-26d5-46db-819d-a416bb76c7ec"

# Production Vectorize Configuration
[prod.vectorize]
index_name = "sky-ai-memory-prod"

# Production R2 Configuration
[prod.r2]
bucket_name = "sky-ai-artifacts-prod"

# Production Queue Configuration
[prod.queues]
embedding_queue = "sky-ai-embeddings-prod"
